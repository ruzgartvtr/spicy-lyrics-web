<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <title>Spicy Lyrics</title>
    <style>
      body { margin: 0; width: 300px; font: 14px/1.4 Helvetica, sans-serif; background: #121212; color: #fff; }
      main { padding: 16px; display: grid; gap: 10px; }
      button {
        width: 100%; border: 0; border-radius: 999px; padding: 14px 16px;
        background: #1ed760; color: #000; font: 700 15px/1 Helvetica, sans-serif; cursor: pointer;
      }
      button.secondary { background: #333; color: #fff; }
      button:disabled { opacity: 0.5; }
      p { margin: 0; color: #b3b3b3; }
      a { color: #1ed760; }
      label { font-size: 12px; color: #b3b3b3; }
      input {
        width: 100%; box-sizing: border-box; border: 0; border-radius: 8px;
        padding: 10px; background: #1f1f1f; color: #fff; font: 12px/1.3 ui-monospace, monospace;
      }
      #status { min-height: 1.2em; color: #ffd166; }
    </style>
  </head>
  <body>
    <main>
      <button id="open" type="button">Spicy Lyrics'i aç</button>
      <label for="key">Publishable key (sl_pk_)</label>
      <input id="key" autocomplete="off" spellcheck="false" placeholder="sl_pk_...">
      <button id="save" class="secondary" type="button">Anahtarı kaydet</button>
      <p id="status"></p>
      <p>open.spotify.com sekmesindeyken yeşil butona veya buradaki Aç’a bas.</p>
      <p><a id="options" href="options.html">Gelişmiş ayarlar</a></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
